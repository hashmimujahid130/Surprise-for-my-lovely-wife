<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruhi ❤️ Mujahid</title>
<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#000;color:#fff;text-align:center;overflow:hidden}
.page{display:none;height:100vh;width:100vw;align-items:center;justify-content:center;flex-direction:column}
input,button{padding:12px 20px;border-radius:30px;border:none;font-size:18px;margin:10px}
button{background:#ff3366;color:#fff;cursor:pointer}
button:hover{transform:scale(1.05)}
video{max-width:100%;max-height:100%}
.heart{position:fixed;bottom:-20px;font-size:22px;animation:floatUp 6s linear infinite}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-100vh);opacity:0}}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10}
#popup div{background:#fff;color:#ff3366;padding:25px;border-radius:20px;font-size:18px}
.gallery img{width:200px;border-radius:15px;margin:8px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
</style>
</head>
<body><audio id="bgm" src="music.mp3" loop></audio>

<!-- PAGE 1 PASSWORD --><div id="page1" class="page" style="display:flex">
<h1>🔒 Enter Secret Password</h1>
<input type="password" id="pass" placeholder="Password">
<button onclick="checkPass()">Unlock ❤️</button>
</div><!-- PAGE 2 INTRO VIDEO --><div id="page2" class="page">
<video id="intro" src="intro.mp4"></video>
<button onclick="goMain()">Continue 💖</button>
</div><!-- PAGE 3 MAIN --><div id="page3" class="page">
<h1>Happy Birthday Meri Queen Ruhi 💖</h1>
<div class="gallery">
<img src="img1.jpg">
<img src="img2.jpg">
<img src="img3.jpg">
</div>
<button onclick="showQuiz()">💖 Start Love Quiz 💖</button>
<div id="quiz" style="display:none">
<p>Hamari pehli video call pe Ruhi kya kar rahi thi?</p>
<button onclick="checkAns('right')">Sharma rahi thi</button>
<button onclick="checkAns('wrong')">Gussa</button>
<button onclick="checkAns('wrong')">Ro rahi thi</button>
</div>
</div><div id="popup"><div id="popupText"></div></div><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script><script>
const PASSWORD="Ruhimujahidforever";
const emojis=['❤️','😘','😍','🥰','🫂','🫶🏼'];

function checkPass(){
 if(document.getElementById('pass').value===PASSWORD){
  document.getElementById('page1').style.display='none';
  document.getElementById('page2').style.display='flex';
  let v=document.getElementById('intro');
  v.play();
  document.getElementById('bgm').play();
 }
}

function goMain(){
 document.getElementById('page2').style.display='none';
 document.getElementById('page3').style.display='flex';
}

function createHeart(){
 const h=document.createElement('div');
 h.className='heart';
 h.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
 h.style.left=Math.random()*100+'vw';
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),6000);
}
setInterval(createHeart,400);

function showQuiz(){document.getElementById('quiz').style.display='block'}

function fire(){confetti({particleCount:200,spread:120,origin:{y:0.6}})}

function showPopup(t){
 popupText.innerHTML=t;
 popup.style.display='flex';
 setTimeout(()=>popup.style.display='none',4000);
}

function checkAns(a){
 if(a==='right'){fire();showPopup('💖 Bilkul sahi meri jaan! Tum meri duniya ho Ruhi 💖')}
 else{showPopup('😜 Galat! Dobara socho jaan 😘')}
}
</script><!-- Cake Cutting Animation --><div id="cakeBox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:1000;">
  <div style="background:#fff;padding:25px;border-radius:20px;max-width:350px;animation:zoomIn 1s;">
    <h2>🎂 Happy Birthday Meri Queen 🎂</h2>
    <img src="https://i.imgur.com/4M7IWwP.gif" width="200"><br>
    <p>Make a wish meri jaan 💖</p>
    <button onclick="cutCake()">Cut Cake 🎉</button>
  </div>
</div><script>
let unlockCount=0;
function unlock(){
  const btn=document.getElementById('unlockBtn');
  const msg=document.getElementById('funnyMsg');
  const pass=document.getElementById('pass').value;
  if(pass!=="Ruhimujahidforever"){alert('Wrong Password ❤️');return;}
  unlockCount++;
  const lines=[
    '😜 Itni jaldi kya hai Madam ji?',
    '😘 Aree aree thoda patience rakho!',
    '🥰 Bas last click, phir surprise!'
  ];
  if(unlockCount<3){
    msg.innerHTML=lines[unlockCount-1];
    btn.style.position='absolute';
    btn.style.left=Math.random()*70+'%';
    btn.style.top=Math.random()*70+'%';
  }else{
    document.getElementById('lock').classList.add('hidden');
    document.getElementById('video').classList.remove('hidden');
    setTimeout(()=>{document.getElementById('cakeBox').style.display='flex';},8000);
  }
}

function cutCake(){
  document.getElementById('cakeBox').style.display='none';
  fireWorks();
}
</script></body>
</html>

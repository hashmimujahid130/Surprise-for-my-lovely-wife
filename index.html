<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To My Queen Ruhi 💖</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#ff9a9e,#fad0c4);text-align:center;overflow-x:hidden;}
    h1{color:#fff;margin-top:20px;font-size:2.3em;animation:fadeIn 2s;}
    .container{max-width:900px;margin:auto;padding:20px;}
    .gallery img{width:90%;max-width:300px;border-radius:20px;margin:10px;box-shadow:0 8px 20px rgba(0,0,0,.3);animation:zoomIn 2s;}
    button{padding:12px 25px;font-size:18px;border-radius:30px;border:none;background:#ff4d6d;color:#fff;cursor:pointer;margin:15px;box-shadow:0 5px 15px rgba(0,0,0,.2);transition:.3s;}
    button:hover{transform:scale(1.1);background:#ff1f4d;}
    .heart{position:fixed;bottom:-20px;font-size:24px;animation:floatUp 6s linear infinite;}
    @keyframes floatUp{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-100vh);opacity:0;}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes zoomIn{from{transform:scale(.7);}to{transform:scale(1);}}
    #quizBox{background:rgba(255,255,255,.9);padding:20px;border-radius:20px;margin-top:30px;display:none;animation:fadeIn 2s;}
    #popup,#cakePopup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);align-items:center;justify-content:center;z-index:999;}
    #popup div,#cakePopup div{background:#fff;padding:25px;border-radius:20px;max-width:340px;font-size:18px;color:#ff3366;animation:zoomIn 1s;}
  </style>
</head>
<body><audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio><h1>To My Queen Ruhi 💖</h1><div class="container">
  <div class="gallery">
    <img src="img1.jpg">
    <img src="img2.jpg">
    <img src="img3.jpg">
  </div><button onclick="showQuiz()">💖 Surprise Quiz 💖</button>

  <div id="quizBox">
    <p style="font-size:18px;font-weight:600;color:#d63384;">Hamari pehli video call pe Ruhi kya kar rahi thi?</p>
    <button onclick="checkAns('sharma')">Sharma rahi thi</button>
    <button onclick="checkAns('gussa')">Gussa kar rahi thi</button>
    <button onclick="checkAns('ro')">Ro rahi thi</button>
  </div>
</div><div id="popup"><div id="popupText"></div></div><div id="cakePopup">
  <div>
    <h2>🎂 Happy Birthday Meri Queen 🎂</h2>
    <img src="https://i.imgur.com/4M7IWwP.gif" width="200"><br>
    <p>Make a wish meri jaan 💖</p>
    <button onclick="cutCake()">Cut Cake 🎉</button>
  </div>
</div><script>
const emojis=['❤️','😘','😍','🥰','🫂','🫶🏼'];

function createHeart(){
  const h=document.createElement('div');
  h.className='heart';
  h.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(20+Math.random()*25)+'px';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
}
setInterval(createHeart,400);

function showQuiz(){document.getElementById('quizBox').style.display='block';}

function fireWorks(){confetti({particleCount:200,spread:100,origin:{y:0.6}});}  

function checkAns(ans){
  if(ans==='sharma'){
    fireWorks();
    showPopup('💖 Bilkul sahi! Tum meri zindagi ka sabse khoobsurat hissa ho Ruhi 💖');
  }else{
    showPopup('😜 Galat! Phir se socho meri jaan 😘');
  }
}

function showPopup(text){
  document.getElementById('popupText').innerHTML=text;
  document.getElementById('popup').style.display='flex';
  setTimeout(()=>{document.getElementById('popup').style.display='none';},4000);
}

function showCake(){document.getElementById('cakePopup').style.display='flex';fireWorks();}
function cutCake(){document.getElementById('cakePopup').style.display='none';setTimeout(finalMessage,1500);}

function finalMessage(){
  showPopup('💌 Ruhi, tum meri duniya ho. Tumhari muskaan meri taqat hai, tumhara pyaar meri zindagi. Happy Birthday meri Queen 👑💖');
}

setTimeout(showCake,10000);
</script>
<script>
var password = "Ruhimujahidforever";
var user = prompt("💖 Enter Surprise Password 💖");

if (user !== password) {
  alert("❌ Wrong Password! Surprise Locked 😜");
  window.location.href = "https://google.com";
}
</script></body>
</html>
